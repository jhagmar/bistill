[workspace]
resolver = "3"
members = ["crates/json", "crates/host", "crates/tui", "crates/bistill-lib", "crates/bistill"]

[workspace.package]
authors = ["Jonas Hagmar <jonas.hagmar@protonmail.com>"]
edition = "2024"
homepage = "https://github.com/jhagmar/bistill"
license = "MIT"
publish = false
repository = "https://github.com/jhagmar/bistill"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
bistill-lib = { path = "crates/bistill-lib", version = "0.1.0" }
host = { path = "crates/host", version = "0.1.0" }
json = { path = "crates/json", version = "0.1.0" }
tui = { path = "crates/tui", version = "0.1.0" }
