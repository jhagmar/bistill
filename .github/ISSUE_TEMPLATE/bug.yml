name: Bug
description: Report a defect in bistill
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: git SHA
    validations:
      required: true
